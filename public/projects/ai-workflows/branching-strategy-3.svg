<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1000" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="2000" height="1000" rx="28" fill="#fafafa"/>

  <!-- Title -->
  <text x="70" y="88" font-size="40" font-weight="700" fill="#0a0a0a">How I prototype in code</text>
  <text x="70" y="132" font-size="24" fill="#6b7280">AI-assisted prototype branches in the real Gearset codebase, not static mockups</text>

  <!-- Tool chips -->
  <g>
    <rect x="451" y="250" width="248" height="70" rx="35" fill="#0a0a0a"/>
    <text x="575" y="294" font-size="24" font-weight="600" fill="#ffffff" text-anchor="middle">VS Code · Claude</text>
    <line x1="575" y1="320" x2="575" y2="470" stroke="#c7c9cf" stroke-width="3" stroke-dasharray="6 7"/>
  </g>
  <g>
    <rect x="820" y="250" width="260" height="70" rx="35" fill="#0a0a0a"/>
    <text x="950" y="294" font-size="24" font-weight="600" fill="#ffffff" text-anchor="middle">GitHub · draft PR</text>
    <line x1="950" y1="320" x2="950" y2="470" stroke="#c7c9cf" stroke-width="3" stroke-dasharray="6 7"/>
  </g>

  <!-- Lane labels -->
  <text x="70" y="507" font-size="24" font-weight="700" fill="#e63329">prototype/ux</text>
  <text x="70" y="835" font-size="24" font-weight="700" fill="#374151">main</text>

  <!-- Main line -->
  <line x1="250" y1="860" x2="1900" y2="860" stroke="#111827" stroke-width="6"/>
  <!-- Prototype branch line -->
  <path d="M 300 860 C 360 860 380 500 440 500 L 1520 500" fill="none" stroke="#111827" stroke-width="6"/>
  <!-- Hand-off curve down to main -->
  <path d="M 1240 528 C 1380 600 1440 860 1495 860" fill="none" stroke="#16a34a" stroke-width="6"/>

  <!-- 1 branch off main -->
  <circle cx="300" cy="860" r="30" fill="#2563eb"/>
  <text x="300" y="869" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="300" y="930" font-size="22" font-weight="600" fill="#0a0a0a" text-anchor="middle">Branch off main</text>

  <!-- 2 prototype with claude -->
  <circle cx="575" cy="500" r="30" fill="#e63329"/>
  <text x="575" y="509" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="575" y="424" font-size="22" font-weight="700" fill="#0a0a0a" text-anchor="middle">Prototype with Claude</text>
  <text x="575" y="398" font-size="19" fill="#6b7280" text-anchor="middle">real components + data, fast iteration</text>

  <!-- 3 push / draft PR -->
  <circle cx="950" cy="500" r="30" fill="#d97706"/>
  <text x="950" y="509" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="950" y="424" font-size="22" font-weight="700" fill="#0a0a0a" text-anchor="middle">Push · draft PR</text>
  <text x="950" y="398" font-size="19" fill="#6b7280" text-anchor="middle">get a preview link</text>

  <!-- 4 share for research -->
  <circle cx="1240" cy="500" r="30" fill="#0891b2"/>
  <text x="1240" y="509" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="1240" y="424" font-size="22" font-weight="700" fill="#0a0a0a" text-anchor="middle">Share with team + customers</text>
  <text x="1240" y="398" font-size="19" fill="#6b7280" text-anchor="middle">test the real behaviour, not a picture</text>

  <!-- 5a save + document -->
  <circle cx="1520" cy="500" r="30" fill="#94a3b8"/>
  <text x="1520" y="509" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="1585" y="493" font-size="22" font-weight="700" fill="#0a0a0a">Save + document</text>
  <text x="1585" y="522" font-size="19" fill="#6b7280">Slack, Notion or the project files</text>

  <!-- 5b hand off -->
  <circle cx="1520" cy="860" r="30" fill="#16a34a"/>
  <text x="1520" y="869" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <text x="1585" y="853" font-size="22" font-weight="700" fill="#0a0a0a">Or hand off to engineering</text>
  <text x="1585" y="882" font-size="19" fill="#6b7280">if it ships: full engineering bar</text>
</svg>
